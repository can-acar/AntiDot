# XcodeGen spesifikasyonu. Xcode projesini üretmek için:
#   brew install xcodegen && xcodegen generate
name: AntiDot
options:
  bundleIdPrefix: com.canacar
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Kendi Apple Developer Team ID'nizi girin (Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  AntiDot:
    type: application
    platform: iOS
    sources: [AntiDot]
    info:
      path: AntiDot/Info.plist
      properties:
        CFBundleDisplayName: AntiDot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: AntiDot/AntiDot.entitlements
      properties:
        com.apple.developer.networking.networkextension: [dns-settings]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canacar.antidot
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AntiDotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AntiDotTests]
    dependencies:
      - target: AntiDot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canacar.antidot.tests
schemes:
  AntiDot:
    build:
      targets:
        AntiDot: all
    test:
      targets: [AntiDotTests]
