# XcodeGen spesifikasyonu. Xcode projesini üretmek için:
#   brew install xcodegen && xcodegen generate
name: AntiDot
options:
  bundleIdPrefix: com.canacar
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer Team ID (Xcode > Signing & Capabilities). Fork'larda kendinizinkiyle değiştirin.
    DEVELOPMENT_TEAM: "6Z7VX56BQX"
    CODE_SIGN_STYLE: Automatic
targets:
  AntiDot:
    type: application
    platform: iOS
    sources: [AntiDot]
    info:
      path: AntiDot/Info.plist
      properties:
        CFBundleDisplayName: AntiDot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: AntiDot/AntiDot.entitlements
      properties:
        com.apple.developer.networking.networkextension: [dns-settings, packet-tunnel-provider]
    dependencies:
      - target: AntiDotTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canacar.antidot
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AntiDotTunnel:
    type: app-extension
    platform: iOS
    sources:
      - AntiDotTunnel
      - AntiDot/Models/DNSResolver.swift
      - AntiDot/Services/DNSMessage.swift
      - AntiDot/Services/EncryptedDNSClient.swift
    info:
      path: AntiDotTunnel/Info.plist
      properties:
        CFBundleDisplayName: AntiDot Tünel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: AntiDotTunnel/AntiDotTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canacar.antidot.tunnel
        TARGETED_DEVICE_FAMILY: "1"
  AntiDotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AntiDotTests, AntiDotTunnel/IPv4UDPPacket.swift]
    dependencies:
      - target: AntiDot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canacar.antidot.tests
schemes:
  AntiDot:
    build:
      targets:
        AntiDot: all
    test:
      targets: [AntiDotTests]
